<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>গোলাপি ফাউন্ডেশন — অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F5; --ink:#241A1D; --rose:#B23A5C; --rose-deep:#8C2C48;
    --tint:#F3DEE3; --gold:#C9A961; --green:#4A6B58; --line: rgba(36,26,29,0.14);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#1B1416; --ink:#F3E9EA; --tint:#2E2024; --line: rgba(243,233,234,0.16); }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Noto Serif Bengali',serif;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 60px;}

  /* login */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0 24px;}
  .login-card{width:100%;max-width:340px;}
  .login-card h1{font-size:20px;font-weight:600;margin-bottom:4px;}
  .login-card p{font-size:13.5px;color:color-mix(in srgb, var(--ink) 60%, transparent);margin-bottom:22px;}
  .field{margin-top:12px;}
  .field label{display:block;font-size:13px;color:color-mix(in srgb, var(--ink) 65%, transparent);margin-bottom:6px;}
  .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:15px;}
  .btn{padding:13px 16px;border-radius:4px;border:none;background:var(--rose);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%;margin-top:18px;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500;}
  .err-msg{font-size:13.5px;color:var(--rose-deep);margin-top:10px;display:none;}

  /* app shell */
  #appView{display:none;}
  header{padding:18px 0;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:50%;background:var(--rose);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
  .brand-name{font-weight:600;font-size:15px;}
  .logout{font-size:13px;color:color-mix(in srgb, var(--ink) 55%, transparent);background:none;border:none;cursor:pointer;font-family:inherit;}

  .fund-strip{border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;justify-content:space-between;background:color-mix(in srgb, var(--tint) 40%, transparent);}
  .fund-strip div{text-align:center;flex:1;}
  .fund-strip strong{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--rose-deep);}
  .fund-strip span{font-size:11.5px;color:color-mix(in srgb, var(--ink) 60%, transparent);}
  .adjust-btn{margin-top:10px;font-size:12.5px;background:none;border:1px solid var(--line);border-radius:100px;padding:6px 14px;color:var(--ink);font-family:inherit;cursor:pointer;}

  .tabs{display:flex;gap:6px;margin-top:22px;border-bottom:1px solid var(--line);}
  .tab{flex:1;padding:11px 4px;text-align:center;font-size:13.5px;background:none;border:none;color:color-mix(in srgb, var(--ink) 55%, transparent);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;}
  .tab.active{color:var(--rose-deep);font-weight:600;border-color:var(--rose);}
  .panel{display:none;padding-top:16px;}
  .panel.active{display:block;}
  .empty{font-size:13.5px;color:color-mix(in srgb, var(--ink) 55%, transparent);padding:30px 0;text-align:center;}

  .card{border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px;}
  .app-card{display:flex;gap:12px;}
  .app-photo{width:64px;height:64px;border-radius:4px;object-fit:cover;flex:none;background:var(--tint);}
  .app-info{flex:1;min-width:0;}
  .app-info h3{font-size:15px;font-weight:600;}
  .app-info .meta{font-size:12.5px;color:color-mix(in srgb, var(--ink) 58%, transparent);margin-top:3px;}
  .app-actions{display:flex;gap:8px;margin-top:12px;}
  .app-actions button{flex:1;padding:9px;border-radius:4px;font-size:13px;font-family:inherit;cursor:pointer;}
  .btn-approve{background:var(--green);border:none;color:#fff;font-weight:600;}
  .btn-reject{background:transparent;border:1px solid var(--line);color:var(--ink);}

  .don-row{display:flex;justify-content:space-between;align-items:center;}
  .don-row .amt{font-weight:700;font-size:16px;color:var(--rose-deep);font-variant-numeric:tabular-nums;}
  .don-row .meta{font-size:12.5px;color:color-mix(in srgb, var(--ink) 58%, transparent);margin-top:3px;}
  .btn-confirm{margin-top:10px;width:100%;padding:9px;border-radius:4px;background:var(--green);border:none;color:#fff;font-weight:600;font-family:inherit;font-size:13px;cursor:pointer;}

  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;margin-top:4px;}
  .badge.paid{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green);}
  .badge.rejected{background:color-mix(in srgb, var(--rose) 14%, transparent);color:var(--rose-deep);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:100px;font-size:13.5px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1 class="serif">অ্যাডমিন লগইন</h1>
    <p>গোলাপি ফাউন্ডেশন — শুধু অনুমোদিত টিমের জন্য।</p>
    <div class="field"><label>ইমেইল</label><input type="email" id="loginEmail"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="loginPass"></div>
    <button class="btn" id="loginBtn">লগইন করুন</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<div id="appView">
  <div class="wrap">
    <header>
      <div class="brand"><div class="brand-mark">গ</div><div class="brand-name">অ্যাডমিন প্যানেল</div></div>
      <button class="logout" id="logoutBtn">লগআউট</button>
    </header>

    <div class="fund-strip">
      <div><strong id="sBalance">০</strong><span>ব্যালেন্স</span></div>
      <div><strong id="sDonors">০</strong><span>দাতা</span></div>
      <div><strong id="sHelped">০</strong><span>সহায়তাপ্রাপ্ত</span></div>
    </div>
    <button class="adjust-btn" id="adjustBtn">ম্যানুয়াল ব্যালেন্স যোগ/বিয়োগ (ব্যাংক)</button>

    <div class="tabs">
      <button class="tab active" data-tab="apps">আবেদন</button>
      <button class="tab" data-tab="dons">দান</button>
      <button class="tab" data-tab="history">ইতিহাস</button>
    </div>

    <div class="panel active" id="panel-apps"></div>
    <div class="panel" id="panel-dons"></div>
    <div class="panel" id="panel-history"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAK99NxwtyqRawZIBUECTGYM6knekRUz5I",
    authDomain: "golapifoundation-84533.firebaseapp.com",
    projectId: "golapifoundation-84533",
    storageBucket: "golapifoundation-84533.firebasestorage.app",
    messagingSenderId: "691772420543",
    appId: "1:691772420543:web:84105a12898f3fcbe9f10a"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
  function bn(n){ const d=['০','১','২','৩','৪','৫','৬','৭','৮','৯']; return String(n).replace(/[0-9]/g,x=>d[x]); }

  /* ---- Auth ---- */
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginErr');
    err.style.display='none';
    try{ await auth.signInWithEmailAndPassword(email, pass); }
    catch(e){ err.textContent='ইমেইল বা পাসওয়ার্ড ভুল।'; err.style.display='block'; }
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=> auth.signOut());

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById('loginView').style.display='none';
      document.getElementById('appView').style.display='block';
      loadFund(); loadApps(); loadDonations(); loadHistory();
    }else{
      document.getElementById('loginView').style.display='flex';
      document.getElementById('appView').style.display='none';
    }
  });

  /* ---- Tabs ---- */
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  /* ---- Fund ---- */
  function loadFund(){
    db.collection('fund').doc('summary').onSnapshot(doc=>{
      const d = doc.data() || {totalBalance:0,totalDonors:0,totalHelped:0};
      document.getElementById('sBalance').textContent = bn(d.totalBalance||0);
      document.getElementById('sDonors').textContent = bn(d.totalDonors||0);
      document.getElementById('sHelped').textContent = bn(d.totalHelped||0);
    });
  }
  document.getElementById('adjustBtn').addEventListener('click', async ()=>{
    const amt = Number(prompt('কত টাকা যোগ করবেন? (বিয়োগের জন্য - দিয়ে লিখুন, যেমন -500)'));
    if(!amt) return;
    await db.collection('fund').doc('summary').set({ totalBalance: firebase.firestore.FieldValue.increment(amt) }, {merge:true});
    showToast('ব্যালেন্স আপডেট হয়েছে');
  });

  /* ---- Applications ---- */
  function loadApps(){
    db.collection('recipients').where('status','==','pending').orderBy('submittedAt','desc')
      .onSnapshot(snap=>{
        const panel = document.getElementById('panel-apps');
        if(snap.empty){ panel.innerHTML = '<div class="empty">নতুন কোনো আবেদন নেই</div>'; return; }
        panel.innerHTML = '';
        snap.forEach(doc=>{
          const d = doc.data();
          const el = document.createElement('div');
          el.className = 'card app-card';
          el.innerHTML = `
            <img class="app-photo" src="${d.photoURL||''}" alt="">
            <div class="app-info">
              <h3>${d.name||''}</h3>
              <div class="meta">${d.phone||''} · bKash ${d.bkash||''}</div>
              <div class="meta">${d.village||''}, ${d.union||''}, ${d.upazila||''}, ${d.district||''}, ${d.division||''}</div>
              <div class="meta">ওয়ার্ড ${d.ward||''} · বাড়ি: ${d.house||''}</div>
              <div class="meta">স্বামী/স্ত্রী: ${d.spouseName||'—'} · আত্মীয়: ${d.relativeName||''}</div>
              <div class="app-actions">
                <button class="btn-approve" data-id="${doc.id}" data-act="approve">অনুমোদন + অর্থ প্রদান</button>
                <button class="btn-reject" data-id="${doc.id}" data-act="reject">বাতিল</button>
              </div>
            </div>`;
          panel.appendChild(el);
        });
      }, err=>{ document.getElementById('panel-apps').innerHTML = '<div class="empty">লোড করা যায়নি: '+err.message+'</div>'; });
  }

  document.getElementById('panel-apps').addEventListener('click', async (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    const id = btn.dataset.id, act = btn.dataset.act;
    if(act==='reject'){
      if(!confirm('আবেদনটি বাতিল করবেন?')) return;
      await db.collection('recipients').doc(id).update({status:'rejected', decidedAt: firebase.firestore.FieldValue.serverTimestamp()});
      showToast('আবেদন বাতিল করা হয়েছে');
    }
    if(act==='approve'){
      const amt = Number(prompt('কত টাকা প্রদান করা হবে?'));
      if(!amt || amt<=0) return;
      try{
        await db.runTransaction(async (tx)=>{
          const fundRef = db.collection('fund').doc('summary');
          const fundDoc = await tx.get(fundRef);
          const bal = (fundDoc.data()||{}).totalBalance || 0;
          if(bal < amt){ throw new Error('তহবিলে পর্যাপ্ত ব্যালেন্স নেই (বর্তমান ব্যালেন্স: '+bal+' টাকা)'); }
          tx.update(db.collection('recipients').doc(id), { status:'paid', disbursedAmount: amt, paidAt: firebase.firestore.FieldValue.serverTimestamp() });
          tx.update(fundRef, { totalBalance: firebase.firestore.FieldValue.increment(-amt), totalHelped: firebase.firestore.FieldValue.increment(1) });
        });
        showToast('অনুমোদন ও অর্থ প্রদান সম্পন্ন');
      }catch(err){ alert(err.message); }
    }
  });

  /* ---- Donations ---- */
  function loadDonations(){
    db.collection('donations').where('status','==','pending').orderBy('createdAt','desc')
      .onSnapshot(snap=>{
        const panel = document.getElementById('panel-dons');
        if(snap.empty){ panel.innerHTML = '<div class="empty">অপেক্ষমাণ কোনো দান নেই</div>'; return; }
        panel.innerHTML = '';
        snap.forEach(doc=>{
          const d = doc.data();
          const el = document.createElement('div');
          el.className = 'card';
          el.innerHTML = `
            <div class="don-row"><div><strong>${d.name||'অজ্ঞাত'}</strong><div class="meta">${d.phone||''} · TrxID: ${d.trxId||''}</div></div><div class="amt">৳${d.amount||0}</div></div>
            <button class="btn-confirm" data-id="${doc.id}" data-amt="${d.amount||0}">নিশ্চিত করুন</button>`;
          panel.appendChild(el);
        });
      }, err=>{ document.getElementById('panel-dons').innerHTML = '<div class="empty">লোড করা যায়নি: '+err.message+'</div>'; });
  }
  document.getElementById('panel-dons').addEventListener('click', async (e)=>{
    const btn = e.target.closest('.btn-confirm'); if(!btn) return;
    const id = btn.dataset.id, amt = Number(btn.dataset.amt);
    if(!confirm('এই দানটি তহবিলে যুক্ত করবেন?')) return;
    await db.runTransaction(async (tx)=>{
      const fundRef = db.collection('fund').doc('summary');
      tx.update(db.collection('donations').doc(id), { status:'confirmed', confirmedAt: firebase.firestore.FieldValue.serverTimestamp() });
      tx.update(fundRef, { totalBalance: firebase.firestore.FieldValue.increment(amt), totalDonors: firebase.firestore.FieldValue.increment(1) });
    });
    showToast('দান তহবিলে যুক্ত হয়েছে');
  });

  /* ---- History ---- */
  function loadHistory(){
    db.collection('recipients').where('status','in',['paid','rejected']).orderBy('submittedAt','desc').limit(30)
      .onSnapshot(snap=>{
        const panel = document.getElementById('panel-history');
        if(snap.empty){ panel.innerHTML = '<div class="empty">এখনো কোনো ইতিহাস নেই</div>'; return; }
        panel.innerHTML = '';
        snap.forEach(doc=>{
          const d = doc.data();
          const el = document.createElement('div');
          el.className = 'card';
          el.innerHTML = `<h3 style="font-size:14.5px;font-weight:600;">${d.name||''}</h3>
            <div class="meta" style="font-size:12.5px;color:color-mix(in srgb, var(--ink) 58%, transparent);">${d.phone||''}${d.disbursedAmount ? ' · ৳'+d.disbursedAmount+' প্রদান করা হয়েছে' : ''}</div>
            <span class="badge ${d.status==='paid'?'paid':'rejected'}">${d.status==='paid'?'সহায়তা প্রদান সম্পন্ন':'বাতিল হয়েছে'}</span>`;
          panel.appendChild(el);
        });
      }, err=>{ document.getElementById('panel-history').innerHTML = '<div class="empty">লোড করা যায়নি: '+err.message+'</div>'; });
  }
</script>
</body>
</html>
